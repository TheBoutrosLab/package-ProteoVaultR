# Add the deployed site URL when GitHub Pages is configured.
destination: docs/site

template:
  bootstrap: 5

home:
  title: Analyze proteomics results with ProteoVaultR

navbar:
  structure:
    left: [articles, reference, changelog]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
        - text: Overview
          href: articles/overview.html
        - text: Installation
          href: articles/installation.html
        - text: Downloading the demo data
          href: articles/demo-data.html
        - text: Exploring a database
          href: articles/exploring-a-database.html
        - text: Preparing data
          href: articles/preparing-data.html
        - text: Quality control
          href: articles/qc.html
        - text: Normalization
          href: articles/normalization.html
        - text: Missing values
          href: articles/missing-values.html
        - text: Differential abundance
          href: articles/differential-abundance.html
        - text: Exploring proteins
          href: articles/exploring-proteins.html
    changelog:
      text: Changelog
      href: CHANGELOG.html

articles:
  - title: Articles
    contents:
      - overview
      - installation
      - demo-data
      - exploring-a-database
      - preparing-data
      - qc
      - normalization
      - missing-values
      - differential-abundance
      - exploring-proteins

