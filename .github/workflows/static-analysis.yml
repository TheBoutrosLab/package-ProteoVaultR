name: R static analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lintr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr
          needs: check
      - name: Lint R package
        run: |
          Rscript -e 'lints <- lintr::lint_package(); print(lints); if (length(lints)) quit(status = 1L)'
