name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install lintr
        run: Rscript -e 'install.packages("lintr")'
      - name: Lint R package
        run: |
          Rscript -e 'lints <- lintr::lint_package(); print(lints); if (length(lints)) quit(status = 1L)'
